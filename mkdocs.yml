site_name: Workspace Pribadi
site_description: Portal kerja pribadi — notula, agenda, tugas, dan arsip
site_author: Nama Anda
docs_dir: docs
theme:
  name: material
  language: id
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Mode Gelap
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mode Terang
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Beranda: index.md
  - Notula Rapat:
      - Daftar Notula: notula/index.md
      - Template Notula: notula/template-notula.md
  - Agenda Kerja:
      - Jadwal Bulanan: agenda/index.md
      - Template Agenda: agenda/template-agenda.md
  - Task Tracker:
      - Daftar Tugas: tasks/index.md
      - Template Tugas: tasks/template-tasks.md
  - Catatan Pribadi:
      - Jurnal: catatan/index.md
      - Template Catatan: catatan/template-catatan.md
  - Arsip:
      - Dokumen Penting: arsip/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - toc:
      permalink: true
